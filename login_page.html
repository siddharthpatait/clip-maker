<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Maker · Sign in</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#14161a; --muted:#6a7080; --line:#e4e7ec; --field:#f3f4f7;
          --field-line:#dfe2e8; --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0ff;
          --err:#b91c1c; --err-soft:#fdeaea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a20; --text:#eef0f4; --muted:#9aa1b1; --line:#262a33; --field:#1e222a;
            --field-line:#2d323c; --accent:#7c74ff; --accent-hover:#9089ff; --accent-soft:#25234a;
            --err:#f87171; --err-soft:#2e1717; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:4px; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--accent); display:grid; place-items:center; }
  .logo svg { width:16px; height:16px; fill:#fff; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  input { width:100%; height:42px; padding:0 12px; font:15px inherit; color:var(--text); background:var(--field);
          border:1px solid var(--field-line); border-radius:9px; }
  input:focus { outline:none; border-color:var(--accent); background:var(--panel); box-shadow:0 0 0 3px var(--accent-soft); }
  button { width:100%; height:44px; margin-top:20px; border:0; border-radius:10px; background:var(--accent); color:#fff;
           font:600 15px inherit; cursor:pointer; }
  button:hover { background:var(--accent-hover); }
  .err { background:var(--err-soft); color:var(--err); border-radius:9px; padding:10px 12px; font-size:14px; margin-bottom:6px; }
  .err:empty { display:none; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>Clip Maker</div>
  <p class="sub">Sign in with your email and the password you were given.</p>
  <div class="err">{{error}}</div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{email}}" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
